services:
  ocr:
    image: ${OCR_IMAGE:-ghcr.io/chbister/com.mybister.ocr:latest}
    build: .
    #container_name: ocr
    expose:
      - "3000"
    volumes:
      - ./_uploads:/app/temp
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - proxy-network
  ocr-lb:
    image: nginx:latest
    expose:
      - "3000"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - ocr
    restart: unless-stopped
    networks:
      - proxy-network
networks:
  proxy-network:
    # Target systems join the existing shared network (default),
    # local dev gets an auto-created project network instead:
    # PROXY_NETWORK_EXTERNAL=false in .env
    external: ${PROXY_NETWORK_EXTERNAL:-true}
